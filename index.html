<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Companion for the Black Tusk clan of Largashbur on Daedric Online." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Black Tusks" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="preload" as="image" href="./img/largashbur-dim.webp" />
    <link rel="preload" as="image" href="./img/largashbur.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./img/banner.webp" />
    <title>Black Tusk Companion</title>
    <!-- Opened from the home screen, the app has the whole screen to itself. iPhones and iPads
         can start such an app with a page that is shorter than the screen by the height of the
         status bar, which leaves an empty band along the bottom (WebKit bug 254868). So the styles
         are told when this is the home-screen app ("is-app"), and there every full-screen layer is
         sized from the screen itself (--full) instead of from the page. This runs before anything
         is drawn, so nothing jumps. -->
    <style>
      :root { --full: 100%; --page: 100dvh; }
      html.is-app { --full: max(100%, 100vh, var(--screen-h, 0px)); --page: max(100vh, var(--screen-h, 0px)); }
    </style>
    <script>
      (function () {
        var root = document.documentElement, nav = window.navigator;
        var mq = window.matchMedia ? window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)') : null;
        function fit() {
          var app = nav.standalone === true || !!(mq && mq.matches);
          root.classList.toggle('is-app', app);
          var px = 0;
          if (app && nav.standalone === true && window.screen && /iPhone|iPod/.test(nav.userAgent)) {
            // An iPhone home-screen app always has the whole screen (an iPad's can sit in a window, so
            // iPads are left to the styles alone). The screen's own size is the truth: screen.width and
            // screen.height do not turn with the phone, so pick the one that runs down the page now.
            var short = Math.min(screen.width, screen.height), long = Math.max(screen.width, screen.height);
            var w = window.innerWidth, h = window.innerHeight;
            var full = Math.abs(w - short) <= 1 ? long : Math.abs(w - long) <= 1 ? short : 0;   // 0: a window that does not span the screen
            if (full && h <= full + 1 && full - h <= 110) px = full;
          }
          if (px) root.style.setProperty('--screen-h', px + 'px'); else root.style.removeProperty('--screen-h');
        }
        fit();
        ['resize', 'orientationchange', 'pageshow'].forEach(function (e) { window.addEventListener(e, fit); });
        document.addEventListener('visibilitychange', fit);
        if (mq && mq.addEventListener) mq.addEventListener('change', fit);
      })();
    </script>
  </head>
  <body>
    <!-- The loading screen. It is plain HTML so it shows before any script has arrived,
         and src/lib/splash.ts takes it away once the screen behind it is whole. -->
    <style>
      #splash { position: fixed; top: 0; left: 0; right: 0; height: var(--full); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: #000 radial-gradient(90% 70% at 50% 42%, #3a0d08 0%, #170504 48%, #000 100%);
        color: #ece3cf; text-align: center; transition: opacity 0.45s ease; }
      #splash.is-done { opacity: 0; pointer-events: none; }
      #splash img { width: min(62vw, 46vh, 420px); aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.8)); }
      #splash div { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #splash b { font: 300 clamp(20px, 4.6vh, 34px)/1.1 'Antonio Variable', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; margin-right: -0.3em; white-space: nowrap; }
      #splash span { font: 400 clamp(12px, 1.9vh, 15px)/1.2 'Antonio Variable', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(236, 227, 207, 0.6); }
      #splash i { display: block; width: min(60vw, 260px); height: 2px; background: rgba(236, 227, 207, 0.16); overflow: hidden; }
      #splash i::after { content: ''; display: block; height: 100%; width: var(--p, 8%); background: linear-gradient(90deg, #e0522c, #ff9248); box-shadow: 0 0 10px #e0522c; transition: width 0.35s ease; }
      @media (orientation: landscape) and (max-height: 480px) { #splash { flex-direction: row; gap: 5vw; } #splash img { width: min(36vw, 78vh); } #splash b { font-size: clamp(18px, 7vh, 30px); } #splash i { width: min(34vw, 240px); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash i::after { transition: none; } }
    </style>
    <div id="splash" role="status" aria-live="polite" aria-label="Black Tusk Companion is loading">
      <img src="./img/banner.webp" alt="" />
      <div><b>The Black Tusks</b><i></i><span>Stoking the fire</span></div>
    </div>
    <noscript><style>#splash { display: none; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
